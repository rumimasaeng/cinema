<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>내 시네마</title>
<style>
html,body{margin:0;height:100%;background:#0b0710;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;color:#fff;touch-action:none}
#css{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#gl{position:fixed;inset:0;z-index:1;display:block;touch-action:none;-webkit-user-select:none;user-select:none}
#title{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:10px;z-index:6;background:rgba(10,8,14,.7);border-radius:14px;padding:8px 14px;font-size:15px}
#tag{position:fixed;z-index:3;transform:translate(-50%,-100%);background:rgba(10,8,14,.65);padding:3px 9px;border-radius:10px;font-size:13px;pointer-events:none;white-space:nowrap}
.fx{position:fixed;z-index:4;font-size:26px;pointer-events:none;transform:translate(-50%,-100%);transition:transform 1.6s ease-out,opacity 1.6s}
#btns{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:6;display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;max-width:270px;-webkit-user-select:none;user-select:none}
#btns button{background:rgba(30,24,40,.85);color:#fff;border:1px solid #554;border-radius:14px;padding:12px 14px;font-size:15px}
#joy{position:fixed;left:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);z-index:6;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.3);touch-action:none}
#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.55)}
#modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:20px}
#modal.on{display:flex}
#box{background:#1c1626;border-radius:18px;padding:20px;width:100%;max-width:420px;box-sizing:border-box}
#box p{margin:0 0 12px;font-size:15px}
#box input{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #665;background:#0e0a14;color:#fff;font-size:16px;-webkit-user-select:text;user-select:text}
#box .row{display:flex;gap:8px;margin-top:12px;justify-content:flex-end}
#box button{padding:10px 16px;border-radius:10px;border:0;font-size:15px;background:#3a3048;color:#fff}
#box button.ok{background:#b48ad0;color:#111}
</style>
</head>
<body>
<div id="css"></div>
<canvas id="gl"></canvas>
<div id="title"></div>
<div id="tag"></div>
<div id="joy"><div id="knob"></div></div>
<div id="btns">
  <button id="bStand">일어서기</button>
  <button id="bSit">내 자리 앉기</button>
  <button id="bView">스크린 시점</button>
  <button id="bReact">💗 리액션</button>
  <button id="bVideo">🎬 영상</button>
  <button id="bSound">🔊 소리</button>
</div>
<div id="modal"><div id="box">
  <p>유튜브 링크를 붙여넣어줘</p>
  <input id="url" type="url" inputmode="url" placeholder="https://youtu.be/...">
  <div class="row"><button id="no">취소</button><button class="ok" id="yes">재생</button></div>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ===== 여기만 바꾸면 돼 ===== */
const CONFIG = {
  title: '내 시네마',
  video: '',                 // 유튜브 링크 (비우면 🎬 버튼으로 입력)
  name: '나',
  skin: 0xf2c9a5,
  outfit: 0xb48ad0,
  hair: 0x1a1214,
  hat: false,
  hatColor: 0x222222,
  reaction: '💗'
};
/* =========================== */

const $ = s => document.querySelector(s);
const V3 = THREE.Vector3, clamp = THREE.MathUtils.clamp;
$('#title').textContent = CONFIG.title;
$('#tag').textContent = CONFIG.name;
$('#bReact').textContent = CONFIG.reaction + ' 리액션';

// ---- 렌더러 (WebGL 위 + CSS3D 아래, 스크린 자리는 구멍) ----
const cv = $('#gl');
const ren = new THREE.WebGLRenderer({canvas:cv, antialias:true, alpha:true});
ren.setPixelRatio(Math.min(devicePixelRatio, 2));
ren.setSize(innerWidth, innerHeight);
ren.setClearColor(0x000000, 0);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0b0710, 10, 40);
const cam = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, .1, 80);
addEventListener('resize', () => {
  cam.aspect = innerWidth/innerHeight; cam.updateProjectionMatrix();
  ren.setSize(innerWidth, innerHeight);
});
scene.add(new THREE.AmbientLight(0xffffff, .6));
const lamp = new THREE.PointLight(0xffb070, 1, 35); lamp.position.set(0,6,2); scene.add(lamp);

const mat = c => new THREE.MeshLambertMaterial({color:c});
const box = (w,h,d,c,x,y,z) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat(c)); m.position.set(x,y,z); scene.add(m); return m; };

// ---- 극장 ----
const floor = new THREE.Mesh(new THREE.PlaneGeometry(20,30), mat(0x2a0f18)); floor.rotation.x = -Math.PI/2; floor.position.z = 2; scene.add(floor);
box(20,9,.3,0x120a16,0,4.5,-11);          // 스크린 벽
box(20,9,.3,0x160c1a,0,4.5,16.5);         // 뒷벽
box(.3,9,30,0x160c1a,-10,4.5,2); box(.3,9,30,0x160c1a,10,4.5,2);
const rowsZ = [8,5.8,3.6,1.4,-.8,-3], seatX = [-5,-4,-3,-2,-1,1,2,3,4,5];
rowsZ.forEach(z => seatX.forEach(x => { box(.8,.5,.8,0x7a1f2e,x,.25,z); box(.8,.8,.15,0x6a1828,x,.9,z+.4); }));
const MY_SEAT = {x:-1, z:3.6};

// ---- 벽면 스크린 (유튜브) ----
const SW = 12, SH = 6.75, SY = 4.6, SZ = -10.8;
box(SW+.6, SH+.6, .2, 0x050505, 0, SY, SZ-.15);   // 스크린 테두리
const hole = new THREE.Mesh(new THREE.PlaneGeometry(SW,SH),
  new THREE.MeshBasicMaterial({color:0x000000, opacity:0, transparent:false, blending:THREE.NoBlending, fog:false}));
hole.position.set(0,SY,SZ); scene.add(hole);
const vid = document.createElement('div');
vid.style.cssText = 'position:absolute;left:0;top:0;transform-origin:0 0;width:960px;height:540px;background:#000;color:#999;display:flex;align-items:center;justify-content:center;font:28px system-ui';
vid.textContent = '🎬 버튼으로 유튜브 링크를 넣어줘';
$('#css').appendChild(vid);

function setVideo(url){
  const m = (url||'').match(/(?:v=|youtu\.be\/|embed\/|shorts\/|live\/)([\w-]{11})/);
  if(!m) return false;
  vid.innerHTML = `<iframe id="yt" title="video" style="width:100%;height:100%;border:0;background:#000" referrerpolicy="strict-origin-when-cross-origin" src="https://www.youtube.com/embed/${m[1]}?playsinline=1&rel=0&autoplay=1&mute=1&enablejsapi=1&origin=${encodeURIComponent(location.origin)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
  return true;
}
if(CONFIG.video) setVideo(CONFIG.video);

// 영상 링크 입력창 (prompt 대신)
const modal = $('#modal'), urlIn = $('#url');
$('#bVideo').onclick = () => { modal.classList.add('on'); setTimeout(() => urlIn.focus(), 50); };
$('#no').onclick = () => modal.classList.remove('on');
$('#yes').onclick = () => {
  if(setVideo(urlIn.value.trim())){ modal.classList.remove('on'); urlIn.value=''; }
  else urlIn.style.borderColor = '#f66';
};
// 소리 켜기 + 재생
$('#bSound').onclick = () => {
  const f = $('#yt'); if(!f) return;
  ['playVideo','unMute'].forEach(fn => f.contentWindow.postMessage(JSON.stringify({event:'command',func:fn,args:[]}), '*'));
};

// ---- 캐릭터 ----
const player = new THREE.Group(), body = new THREE.Group();
const part = (geo,c,x,y,z) => { const m = new THREE.Mesh(geo, mat(c)); m.position.set(x,y,z); body.add(m); return m; };
part(new THREE.CylinderGeometry(.3,.45,.9,16), CONFIG.outfit, 0,.45,0);
part(new THREE.SphereGeometry(.3,16,16), CONFIG.skin, 0,1.15,0);
part(new THREE.SphereGeometry(.33,16,16,0,Math.PI*2,0,Math.PI*.55), CONFIG.hair, 0,1.17,0);
part(new THREE.CylinderGeometry(.09,.09,.6,8), CONFIG.skin, -.42,.55,0);
part(new THREE.CylinderGeometry(.09,.09,.6,8), CONFIG.skin, .42,.55,0);
if(CONFIG.hat){ part(new THREE.CylinderGeometry(.34,.34,.18,16), CONFIG.hatColor, 0,1.42,0); part(new THREE.CylinderGeometry(.5,.5,.04,16), CONFIG.hatColor, 0,1.34,0); }
player.add(body); scene.add(player); player.position.set(0,0,11);

// ---- 조이스틱 / 키보드 ----
const jb = $('#joy'), jk = $('#knob'); const jv = {x:0,y:0}, keys = {};
function jset(e){ const r = jb.getBoundingClientRect(), R = r.width/2; let dx = e.clientX-(r.left+R), dy = e.clientY-(r.top+R); const d = Math.hypot(dx,dy); if(d>R){ dx*=R/d; dy*=R/d; } jk.style.transform = `translate(${dx}px,${dy}px)`; jv.x = dx/R; jv.y = dy/R; }
jb.onpointerdown = e => { jb.setPointerCapture(e.pointerId); jset(e); };
jb.onpointermove = e => { if(e.buttons) jset(e); };
jb.onpointerup = jb.onpointercancel = () => { jk.style.transform=''; jv.x = jv.y = 0; };
addEventListener('keydown', e => { if(e.target.tagName!=='INPUT') keys[e.key.toLowerCase()] = true; });
addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

// ---- 시점: 드래그 회전 / 핀치·휠 확대축소 ----
let yaw = 0, pitch = .35, dist = 5, screenMode = false;
const ptr = new Map(); let pinch0 = 1;
const pd = () => { const a = [...ptr.values()]; return Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y) || 1; };
cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); ptr.set(e.pointerId,{x:e.clientX,y:e.clientY}); if(ptr.size===2) pinch0 = pd(); });
cv.addEventListener('pointermove', e => {
  const p = ptr.get(e.pointerId); if(!p) return;
  if(ptr.size===1){ yaw -= (e.clientX-p.x)*.006; pitch = clamp(pitch+(e.clientY-p.y)*.006, -.1, 1.3); screenMode = false; }
  p.x = e.clientX; p.y = e.clientY;
  if(ptr.size===2){ const d = pd(); dist = clamp(dist*pinch0/d, 1.8, 16); pinch0 = d; screenMode = false; }
});
cv.addEventListener('pointerup', e => ptr.delete(e.pointerId));
cv.addEventListener('pointercancel', e => ptr.delete(e.pointerId));
cv.addEventListener('wheel', e => { dist = clamp(dist*(1+e.deltaY*.001), 1.8, 16); screenMode = false; e.preventDefault(); }, {passive:false});

// ---- 버튼 ----
let sitting = false;
$('#bSit').onclick = () => { sitting = true; player.position.set(MY_SEAT.x,0,MY_SEAT.z); player.rotation.y = 0; body.scale.y = .6; body.position.y = .3; };
$('#bStand').onclick = () => { if(!sitting) return; sitting = false; player.position.set(0,0,MY_SEAT.z+.2); body.scale.y = 1; body.position.y = 0; };
$('#bView').onclick = () => { screenMode = !screenMode; };

const tagEl = $('#tag');
function toScreen(v){ const p = v.clone().project(cam); return {x:(p.x+1)/2*innerWidth, y:(1-p.y)/2*innerHeight, behind:p.z>1}; }
$('#bReact').onclick = () => {
  const s = toScreen(new V3(player.position.x, 2, player.position.z)); if(s.behind) return;
  const el = document.createElement('div'); el.className = 'fx'; el.textContent = CONFIG.reaction;
  el.style.left = s.x+'px'; el.style.top = s.y+'px'; document.body.appendChild(el);
  requestAnimationFrame(() => { el.style.transform = 'translate(-50%,-260%)'; el.style.opacity = 0; });
  setTimeout(() => el.remove(), 1700);
};

// 영상 칸을 3D 스크린 위치에 맞춰 평면(2D) 변환으로 겹침 (구멍 뚫린 자리로만 보임)
function updateScreen(){
  const P = [[-1,1],[1,1],[-1,-1],[1,-1]].map(([a,b]) => toScreen(new V3(a*SW/2, SY+b*SH/2, SZ)));
  if(P.some(q => q.behind)){ vid.style.display = 'none'; return; }
  vid.style.display = 'flex';
  const cx = (P[0].x+P[3].x)/2, cy = (P[0].y+P[3].y)/2, k = 1.04;
  const [tl,tr,bl] = P.map(q => ({x:cx+(q.x-cx)*k, y:cy+(q.y-cy)*k}));
  vid.style.transform = `matrix(${(tr.x-tl.x)/960},${(tr.y-tl.y)/960},${(bl.x-tl.x)/540},${(bl.y-tl.y)/540},${tl.x},${tl.y})`;
}

// ---- 루프 ----
let last = performance.now(); const look = new V3(0,1.2,0); cam.position.set(0,3,16);
(function loop(t){
  requestAnimationFrame(loop);
  const dt = Math.min((t-last)/1000, .05); last = t;
  const p = player.position;
  if(!sitting){
    const ix = jv.x + (keys.d||keys.arrowright?1:0) - (keys.a||keys.arrowleft?1:0);
    const iz = jv.y + (keys.s||keys.arrowdown?1:0) - (keys.w||keys.arrowup?1:0);
    const l = Math.hypot(ix,iz);
    if(l > .08){
      const c = Math.cos(yaw), s = Math.sin(yaw);
      const wx = ix*c + iz*s, wz = -ix*s + iz*c;       // 카메라 기준 방향
      const k = Math.min(l,1)/l * 4 * dt;
      p.x = clamp(p.x + wx*k, -9, 9); p.z = clamp(p.z + wz*k, -9, 14);
      player.rotation.y = Math.atan2(wx,wz);
      body.position.y = Math.abs(Math.sin(t/110))*.06;
    }
  }
  let want, aim;
  if(screenMode){ want = new V3(p.x, sitting?1.7:1.9, p.z+.9); aim = new V3(0,SY-.3,SZ); }
  else{
    const cp = Math.cos(pitch);
    want = new V3(p.x+Math.sin(yaw)*cp*dist, 1.2+Math.sin(pitch)*dist, p.z+Math.cos(yaw)*cp*dist);
    want.x = clamp(want.x,-9.5,9.5); want.z = clamp(want.z,-10,16); want.y = clamp(want.y,.4,8);
    aim = new V3(p.x,1.2,p.z);
  }
  cam.position.lerp(want,.2); look.lerp(aim,.2); cam.lookAt(look);
  const s = toScreen(new V3(p.x, sitting?1.3:1.7, p.z));
  tagEl.style.display = s.behind ? 'none' : 'block';
  tagEl.style.left = s.x+'px'; tagEl.style.top = s.y+'px';
  ren.render(scene, cam); updateScreen();
})(last);
</script>
</body>
</html>
